# Redis 配置文件

# 绑定地址
bind 0.0.0.0

# 端口
port 6379

# 守护进程模式（Docker 中必须为 no）
daemonize no

# 持久化 - RDB
save 900 1
save 300 10
save 60 10000

# 持久化 - AOF
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 数据目录
dir /data

# 日志级别
loglevel notice

# 最大内存（可根据需要调整）
maxmemory 256mb
maxmemory-policy allkeys-lru

# 密码（可选，如需设置请取消注释）
# requirepass your_password_here
