services:
  nacos:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/nacos:2.3.2
    container_name: nacos
    hostname: nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
    volumes:
      - ./data:/home/nacos/data
      - ./logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v1/console/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
