# Broker 配置文件（Apache RocketMQ 5.1.1）

# Broker 名称
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# NameServer 地址
namesrvAddr = namesrv:9876

# 监听端口
listenPort = 10911

# 是否允许 Broker 自动创建 Topic
autoCreateTopicEnable = true

# 是否允许 Broker 自动创建订阅组
autoCreateSubscriptionGroup = true

# Broker 对外服务的IP地址（容器内用主机名，宿主机通过端口映射访问）
brokerIP1 = broker

# 删除文件时间点，默认凌晨4点
deleteWhen = 04

# 文件保留时间，默认48小时
fileReservedTime = 48

# Broker 角色
brokerRole = ASYNC_MASTER

# 刷盘方式
flushDiskType = ASYNC_FLUSH
