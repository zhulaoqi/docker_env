services:
  # RocketMQ NameServer
  namesrv:
    image: apache/rocketmq:5.1.1
    container_name: rocketmq-namesrv
    hostname: namesrv
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    command: sh mqnamesrv
    volumes:
      - ./data/namesrv-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n localhost:9876 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # RocketMQ Broker  
  broker:
    image: apache/rocketmq:5.1.1
    container_name: rocketmq-broker
    hostname: broker
    depends_on:
      namesrv:
        condition: service_healthy
    ports:
      - "10909:10909"
      - "10911:10911"
      - "8081:8081"
      - "8082:8082"
    environment:
      NAMESRV_ADDR: "namesrv:9876"
      # 本地开发建议关闭 TLS（避免自签名证书 + h2c/TLS 不匹配导致 gRPC Stream 提前关闭）
      # 关闭后 Java 客户端使用：rocketmq.ssl-enabled=false + endpoints=localhost:8081
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Dtls.server.mode=disabled -Dtls.test.mode.enable=false"
    command: sh mqbroker -n namesrv:9876 --enable-proxy -c /home/rocketmq/broker.conf -pc /home/rocketmq/rocketmq-5.1.1/conf/rmq-proxy.json
    volumes:
      - ./data/broker-logs:/home/rocketmq/logs
      - ./data/broker-store:/home/rocketmq/store
      - ./broker.conf:/home/rocketmq/broker.conf:ro
      - ./rmq-proxy.json:/home/rocketmq/rocketmq-5.1.1/conf/rmq-proxy.json:ro
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n namesrv:9876 | grep -q 'Broker Name' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # RocketMQ Dashboard (可视化管理界面)
  dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rocketmq-dashboard
    hostname: dashboard
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8080:8082"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx256m -Drocketmq.namesrv.addr=namesrv:9876"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

# 数据存储在本地 ./data 目录
