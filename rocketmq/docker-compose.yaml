version: '3.8'
services:
  namesrv:
    image: apache/rocketmq:5.1.4
    container_name: rmqnamesrv
    ports:
      - "9876:9876"
    networks:
      - rocketmq
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n localhost:9876 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  broker:
    image: apache/rocketmq:5.1.4
    container_name: rmqbroker
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    depends_on:
      namesrv:
        condition: service_healthy
    networks:
      - rocketmq
    command: sh mqbroker
    volumes:
      - ./data/broker-logs:/home/rocketmq/logs
      - ./data/broker-store:/home/rocketmq/store
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rmqnamesrv:9876 | grep -q 'Broker Name' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  proxy:
    image: apache/rocketmq:5.1.4
    container_name: rmqproxy
    networks:
      - rocketmq
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8081:8081"
    restart: on-failure
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    command: sh mqproxy

  dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rocketmq-dashboard
    depends_on:
      broker:
        condition: service_healthy
    networks:
      - rocketmq
    ports:
      - "8082:8082"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx256m -Drocketmq.namesrv.addr=rmqnamesrv:9876"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  rocketmq:
    driver: bridge
